services:
  mysql_orm:
    image: mysql:8.0
    ports:
      - ${LOCAL_IP}:${MYSQL_PORT}:3306
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./test-init.sql:/docker-entrypoint-initdb.d/001-test-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql8_orm:
    image: mysql:8.0
    ports:
      - ${LOCAL_IP}:${MYSQL8_PORT}:3306
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./test-init.sql:/docker-entrypoint-initdb.d/001-test-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis_orm:
    image: redis:8.6.2
    ports:
      - ${LOCAL_IP}:${REDIS_PORT}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis_orm_22:
    image: redis:8.6.2
    ports:
      - ${LOCAL_IP}:${REDIS_PORT_22}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
